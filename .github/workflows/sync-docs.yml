name: Sync Public Docs

# Mirrors selected files from this (private) repo into msfrox/public-docs,
# under repos/<this-repo-name>/. Edit .github/docs-sync.yml to choose which
# files get synced.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Checkout public-docs repo
        uses: actions/checkout@v4
        with:
          repository: msfrox/public-docs
          token: ${{ secrets.DOCS_SYNC_TOKEN }}
          path: public-docs

      - name: Copy listed docs into public-docs
        run: |
          set -euo pipefail
          REPO_NAME="${{ github.event.repository.name }}"
          CONFIG=".github/docs-sync.yml"

          if [ ! -f "$CONFIG" ]; then
            echo "No $CONFIG found in this repo, nothing to sync."
            exit 0
          fi

          DEST_DIR="public-docs/repos/$REPO_NAME"
          rm -rf "$DEST_DIR"
          mkdir -p "$DEST_DIR"

          COUNT=$(yq '.files | length' "$CONFIG")
          for i in $(seq 0 $((COUNT - 1))); do
            SRC=$(yq -r ".files[$i].source" "$CONFIG")
            DEST=$(yq -r ".files[$i].dest // .files[$i].source" "$CONFIG")

            if [ ! -f "$SRC" ]; then
              echo "Warning: source file '$SRC' not found, skipping."
              continue
            fi

            mkdir -p "$DEST_DIR/$(dirname "$DEST")"
            cp "$SRC" "$DEST_DIR/$DEST"
            echo "Synced $SRC -> repos/$REPO_NAME/$DEST"
          done

      - name: Commit and push to public-docs
        run: |
          cd public-docs
          git config user.name "docs-sync-bot"
          git config user.email "docs-sync-bot@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Sync docs from ${{ github.repository }}@${{ github.sha }}"
            git push
          fi
