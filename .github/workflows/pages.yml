name: Deploy to GitHub Pages

# Publishes the allowlist in build/make-site.sh, with every page turned into a redirect to pray.sakina.lk (data/ untouched).
# Needs Settings > Pages > Source = "GitHub Actions"; with "Deploy from a branch" the legacy
# build serves the whole repo and races this workflow.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site from allowlist
        run: |
          # Only files listed in build/make-site.sh are published; docs, tests and build/ stay private.
          bash build/make-site.sh _site-full
          echo "sw.js updated: $(grep SHELL_VERSION _site-full/sw.js | head -1)"

      - name: Verify the full site folder
        run: bash build/verify-site.sh _site-full

      # pray.gear.lk only (the Worker at pray.sakina.lk is built separately and serves the real site):
      # pages redirect to pray.sakina.lk, data/ stays as is for readers such as the Salah-board.
      - name: Turn pages into redirects
        run: |
          cp -R _site-full _site
          bash build/make-gear-redirect.sh _site

      - name: Verify redirect site
        run: bash build/verify-site.sh --gear _site _site-full

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  # A separate job so "Re-run failed jobs" retries only the deploy and reuses the artifact.
  # (Two runs on 2026-11-25 lost the artifact lookup in deploy-pages although the upload succeeded.)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
