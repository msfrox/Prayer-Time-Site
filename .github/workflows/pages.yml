name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Inject build metadata
        run: |
          GIT_SHA=$(git rev-parse --short HEAD)
          echo "Injecting git SHA: $GIT_SHA"
          # Bust the SW shell cache automatically on every deploy
          sed -i "s/__GIT_SHA__/$GIT_SHA/g" sw.js
          echo "sw.js updated: $(grep SHELL_VERSION sw.js | head -1)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
